name: Release

# Cut a release by pushing a version tag:
#   git tag v0.4.0 && git push origin v0.4.0
# The tag is the anchor for the GitHub Release; there is no release without one.
on:
  push:
    tags:
      - "v*"

# Creating a release WRITES to the repo (the release + its assets), unlike CI
# which only reads. Scope the elevated permission to this workflow alone.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast if the pushed tag and package.json disagree. Without this a
      # v0.5.0 tag could ship a zip named ...-0.4.0.zip and nobody would notice
      # until a user downloaded the wrong build.
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (=> ${tag_version}) does not match package.json version ${pkg_version}."
            exit 1
          fi
          echo "Tag and package.json agree on ${pkg_version}."

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      # `wxt zip` builds the extension and writes .output/<name>-<version>.zip.
      - run: pnpm zip

      # Pull just this version's section out of CHANGELOG.md so the release
      # notes are the curated changelog, not the whole file. Matches the
      # "## <version>" heading (with or without a trailing date) and stops at
      # the next "## " heading.
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "( |$)" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${version}."
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          body_path: release-notes.md
          # A "vX.Y.Z-rc.1"-style tag is published as a pre-release rather than
          # the latest stable download.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
