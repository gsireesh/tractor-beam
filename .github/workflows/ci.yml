name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch)
# so we don't pay for stale builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repo. upload-artifact needs no
# extra scope beyond the default token.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # action-setup must precede setup-node so that `cache: pnpm` can find the
      # pnpm binary. Version comes from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc --noEmit` at zero errors IS the regression gate: any newly
      # introduced type error fails the job. `pnpm typecheck` runs `wxt prepare`
      # first to generate .wxt/tsconfig.json that tsconfig.json extends.
      - run: pnpm typecheck

  build:
    name: Build & package
    runs-on: ubuntu-latest
    # Gate the artifact on green: never publish a zip built from code that
    # fails tests or typecheck.
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `wxt zip` builds the extension and writes .output/<name>-<version>.zip.
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: .output/*.zip
          if-no-files-found: error
